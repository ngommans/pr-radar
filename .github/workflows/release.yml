name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # to commit dist/ back to the tag

jobs:
  release:
    name: Build, publish & tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can amend the tag commit with dist/
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check latest npm version
        run: |
          LATEST=$(npm show npm version)
          CURRENT=$(npm --version)
          echo "Current npm: $CURRENT | Latest npm: $LATEST"
          npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build action bundle
        run: npm run build --workspace=packages/action

      - name: Commit dist/ into the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the bundled action (force-add overrides the package-level .gitignore)
          git add -f packages/action/dist/

          # Only commit if there's actually something new
          if ! git diff --cached --quiet; then
            git commit -m "chore: add compiled dist for ${TAG}"
            git tag -f "${TAG}"
            git push --force origin "${TAG}"
          fi

          # Update the floating major-version tag (e.g. v0.0.1 -> v0)
          # This is what users pin when they write uses: ngommans/pr-radar@v1
          MAJOR_TAG="v$(echo "${TAG}" | cut -d. -f1 | tr -d 'v')"
          git tag -f "${MAJOR_TAG}"
          git push --force origin "${MAJOR_TAG}"

      - name: Publish pr-radar-core to npm
        run: npm publish --workspace=packages/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish pr-radar CLI to npm
        run: npm publish --workspace=packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
