name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN cannot create PRs unless the repo setting
          # "Allow GitHub Actions to create and approve pull requests" is enabled
          # (Settings → Actions → General → Workflow permissions).
          # If that setting is off, add a PAT or GitHub App token as
          # RELEASE_PLEASE_TOKEN and switch the token reference below.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
